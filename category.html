<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title id="page-title">Category | AffiLks</title>
  <meta name="description" id="meta-desc" content="Browse eco-friendly plants and gardening products." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <h1 class="logo">AffiLks 🌱</h1>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<main class="container">

  <h2 id="category-title"></h2>

  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Search..." />
    <input type="number" id="minPrice" placeholder="Min ₹" />
    <input type="number" id="maxPrice" placeholder="Max ₹" />

    <select id="sortBy">
      <option value="">Sort</option>
      <option value="priceLow">Price: Low → High</option>
      <option value="priceHigh">Price: High → Low</option>
      <option value="ratingHigh">Rating: High → Low</option>
    </select>
  </div>

  <section id="product-grid" class="product-grid"></section>

</main>

<footer class="site-footer">
  <p>© 2026 AffiLks. Affiliate links may earn us a commission.</p>
</footer>

<script type="module">
  import { fetchProductsByCategory } from "./js/store.js";

  const params = new URLSearchParams(window.location.search);
  const category = params.get("cat");
  const grid = document.getElementById("product-grid");

  document.getElementById("category-title").innerText =
    category ? category.charAt(0).toUpperCase() + category.slice(1) : "Products";

  let products = [];

  function applyFilters() {
    let list = [...products];

    const q = searchInput.value.toLowerCase();
    const min = Number(minPrice.value);
    const max = Number(maxPrice.value);
    const sort = sortBy.value;

    if (q) list = list.filter(p => p.name.toLowerCase().includes(q));
    if (min) list = list.filter(p => p.discountPrice >= min);
    if (max) list = list.filter(p => p.discountPrice <= max);

    if (sort === "priceLow") list.sort((a,b)=>a.discountPrice-b.discountPrice);
    if (sort === "priceHigh") list.sort((a,b)=>b.discountPrice-a.discountPrice);
    if (sort === "ratingHigh") list.sort((a,b)=>(b.rating||0)-(a.rating||0));

    render(list);
  }

  function render(list) {
    grid.innerHTML = "";
    if (!list.length) {
      grid.innerHTML = "<p>No products found.</p>";
      return;
    }

    list.forEach(p => {
      const card = document.createElement("div");
      card.className = "product-card";

      card.innerHTML = `
        <img src="${p.image}" alt="${p.name}">
        <div class="product-title">${p.name}</div>
        <div class="rating">⭐ ${p.rating || "—"}</div>
        <div>
          <span class="price">₹${p.discountPrice}</span>
          <span class="old-price">₹${p.price}</span>
        </div>
        <a class="buy-btn" href="product.html?id=${p.id}">
          View Details
        </a>
      `;

      grid.appendChild(card);
    });
  }

  fetchProductsByCategory(category).then(data => {
    products = data;
    render(products);
  });

  document
    .querySelectorAll("#searchInput, #minPrice, #maxPrice, #sortBy")
    .forEach(el => el.addEventListener("input", applyFilters));
</script>

</body>
</html>
